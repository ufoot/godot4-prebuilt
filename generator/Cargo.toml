# This crate is just a shim around godot-bindings.

[package]
name = "prebuilt-generator"
version = "0.0.0"
edition = "2021"
rust-version = "1.63"
publish = false

[dependencies]

# Use ufoot/gdext fork with 32-bit support (TargetPointerWidth, write_gdextension_headers_for_target)
[build-dependencies.godot-bindings]
git = "https://github.com/ufoot/gdext"
branch = "32bit-fix"
default-features = false
features = ["api-custom", "api-custom-extheader"]
